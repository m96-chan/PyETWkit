name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Upload the built artifacts to PyPI. Use this to finish a release whose
          first attempt failed after the GitHub release was already published.
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wheels:
    name: Build wheels
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: pip install maturin

      - name: Build wheel
        run: maturin build --release --strip -m crates/pyetwkit-core/Cargo.toml

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.python-version }}
          path: target/wheels/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install maturin
        run: pip install maturin

      - name: Build sdist
        run: maturin sdist -m crates/pyetwkit-core/Cargo.toml

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    # A re-run has to be able to publish. v3.0.2 was tagged and announced but
    # never reached PyPI: one wheel build failed, which correctly blocked this
    # job, and the manual re-run that followed went green while skipping it,
    # because `workflow_dispatch` could never satisfy `event_name == 'release'`.
    # The recovery path looked like it had worked. Opting in explicitly keeps a
    # dispatch from publishing by accident while making recovery possible.
    if: github.event_name == 'release' || inputs.publish
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      # PyPI will not let a version be re-uploaded, so a partial set of wheels
      # is not something that can be fixed afterwards. Count them first.
      - name: Check the artifact set is complete
        run: |
          set -euo pipefail
          wheels=$(find dist -name '*.whl' | wc -l)
          sdists=$(find dist -name '*.tar.gz' | wc -l)
          echo "wheels: $wheels, sdists: $sdists"
          find dist -name '*.whl' -o -name '*.tar.gz' | sort
          if [ "$wheels" -ne 5 ]; then
            echo "::error::expected 5 wheels (3.10-3.14), found $wheels"
            exit 1
          fi
          if [ "$sdists" -ne 1 ]; then
            echo "::error::expected 1 sdist, found $sdists"
            exit 1
          fi

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
