name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint-rust:
    name: Lint Rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ""

      - name: Set up Python and venv
        run: |
          uv python install 3.11
          uv venv --python 3.11
          echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Install dependencies
        # black and ruff are pinned: both gate the build with a hard failure, and
        # an unpinned upgrade changes the required formatting or adds lint rules,
        # breaking CI on every branch without any code change. mypy is left
        # unpinned because its step is continue-on-error.
        run: uv pip install "ruff==0.16.6" "black==26.5.1" mypy

      - name: Check formatting with black
        run: black --check src/ tests/ examples/

      - name: Lint with ruff
        run: ruff check src/ tests/ examples/

      - name: Type check with mypy
        run: mypy src/pyetwkit --ignore-missing-imports --exclude '_stubs\.py$'
        continue-on-error: true  # Soft fail for now, will be strict in v0.2.0

  test-rust:
    name: Test Rust
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test --all-features --verbose

  build-wheels:
    name: Build wheels
    runs-on: windows-latest
    needs: [lint-rust, lint-python, test-rust]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ""

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv --python ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-build-py${{ matrix.python-version }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-py${{ matrix.python-version }}-

      - name: Install maturin
        run: uv pip install maturin

      - name: Build wheel
        run: |
          # Clean any old wheels to ensure only the current version is uploaded
          if (Test-Path target/wheels) { Remove-Item -Recurse -Force target/wheels }
          .venv\Scripts\maturin.exe build --release --strip -m crates/pyetwkit-core/Cargo.toml
        shell: pwsh

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: wheels-${{ matrix.python-version }}
          path: target/wheels/*.whl

  test-python:
    name: Test Python
    runs-on: windows-latest
    needs: build-wheels
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ""

      - name: Set up Python ${{ matrix.python-version }}
        run: |
          uv python install ${{ matrix.python-version }}
          uv venv --python ${{ matrix.python-version }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.python-version }}
          path: dist/

      - name: Install wheel and test dependencies
        run: |
          uv pip install pytest pytest-asyncio pytest-cov
          # List all wheels in dist/ to debug version issues
          Get-ChildItem dist/*.whl | ForEach-Object { Write-Host "Found wheel: $($_.Name)" }
          # Get Python minor version for matching wheel (use venv Python)
          $pyVer = & .\.venv\Scripts\python.exe -c "import sys; print(f'cp{sys.version_info.major}{sys.version_info.minor}')"
          Write-Host "Looking for wheel matching Python version: $pyVer"
          # Install the wheel matching this Python version (sort descending to get latest version)
          $wheel = Get-ChildItem dist/*.whl | Where-Object { $_.Name -match $pyVer } | Sort-Object Name -Descending | Select-Object -First 1
          if ($wheel -eq $null) {
            Write-Host "ERROR: No wheel found for $pyVer"
            exit 1
          }
          Write-Host "Installing wheel: $($wheel.FullName)"
          uv pip install "$($wheel.FullName)"
        shell: pwsh

      - name: Run tests
        run: |
          # Copy tests to temp dir to avoid importing src/pyetwkit instead of installed wheel
          $testDir = Join-Path $env:TEMP "pyetwkit_tests"
          if (Test-Path $testDir) { Remove-Item -Recurse -Force $testDir }
          Copy-Item -Recurse "$env:GITHUB_WORKSPACE\tests" $testDir
          cd $testDir
          # Write the report back to the workspace: pytest runs from $testDir, so a
          # bare --cov-report=xml would leave coverage.xml where the upload step
          # cannot see it.
          & "$env:GITHUB_WORKSPACE\.venv\Scripts\pytest.exe" . -v --cov=pyetwkit --cov-branch --cov-report="xml:$env:GITHUB_WORKSPACE\coverage.xml"
        shell: pwsh

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          # Distinguishes the five matrix uploads from each other.
          flags: python-${{ matrix.python-version }}
          # Optional for public repos, but tokenless uploads are rate limited.
          # Unset simply falls back to the tokenless path.
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  install-from-pyproject:
    name: Install through pyproject.toml
    runs-on: windows-latest
    needs: [lint-rust, lint-python, test-rust]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ""

      - name: Set up Python
        run: |
          uv python install 3.11
          uv venv --python 3.11

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-pyproject-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-pyproject-

      # Deliberately no `-m crates/pyetwkit-core/Cargo.toml` anywhere in this job.
      # Every other build passes it, which is what let a broken `[tool.maturin]`
      # stay invisible through green CI (#79). This job is the one that resolves
      # the manifest the way `pip install .` does.
      - name: Install from the working tree
        run: uv pip install .

      - name: Import the installed package
        # Run from outside the workspace so `src/pyetwkit` cannot shadow the
        # installed distribution and make a failed build look like a success.
        run: |
          cd $env:TEMP
          & "$env:GITHUB_WORKSPACE\.venv\Scripts\python.exe" -c "import pyetwkit; from pyetwkit import _core; print(pyetwkit.__version__); print(_core.EtlReader); assert _core.list_providers()"
          & "$env:GITHUB_WORKSPACE\.venv\Scripts\pyetwkit.exe" --help
        shell: pwsh

      - name: Build an sdist through pyproject.toml
        run: |
          uv pip install maturin
          if (Test-Path target/sdist) { Remove-Item -Recurse -Force target/sdist }
          .venv\Scripts\maturin.exe sdist --out target/sdist
        shell: pwsh

      - name: Install from the sdist
        # An sdist that unpacks but cannot compile fails only for users
        # installing from source on an unsupported platform, so build it here.
        run: |
          $sdist = Get-ChildItem target/sdist/*.tar.gz | Select-Object -First 1
          if ($sdist -eq $null) { Write-Host "ERROR: no sdist produced"; exit 1 }
          Write-Host "Installing sdist: $($sdist.Name)"
          uv pip install --reinstall "$($sdist.FullName)"
        shell: pwsh

      - name: Import the package built from the sdist
        run: |
          cd $env:TEMP
          & "$env:GITHUB_WORKSPACE\.venv\Scripts\python.exe" -c "import pyetwkit; from pyetwkit import _core; print(pyetwkit.__version__); assert _core.list_providers()"
        shell: pwsh

  wpp-decoding:
    name: Decode WPP end to end
    runs-on: windows-latest
    needs: [lint-rust, lint-python, test-rust]
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ""

      - name: Set up Python
        run: |
          uv python install 3.12
          uv venv --python 3.12

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-wpp-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wpp-

      - name: Install the package
        run: uv pip install .

      # The committed wpp.etl covers the TMF routes, but not the PDB one: WPP
      # derives the trace GUID from the source file's full path, so a PDB built
      # anywhere other than where the capture was made cannot decode it. Build
      # the provider and capture fresh events here so all three are exercised.
      - name: Build the WPP provider and capture its events
        run: |
          $out = Join-Path $env:RUNNER_TEMP "wpp"
          .\tests\fixtures\create_wpp_etl.ps1 -OutputDir $out -IncludePdb
          echo "WPP_OUT=$out" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Verify every WPP decoding route
        # Fails loudly rather than skipping: a WPP feature that silently stops
        # being exercised is how the first attempt at this shipped broken.
        run: |
          & .venv\Scripts\python.exe tests\wpp_live_check.py `
            "$env:WPP_OUT\wpp.etl" "$env:WPP_OUT\wpp_tmf" "$env:WPP_OUT\wpptest.pdb"
        shell: pwsh
